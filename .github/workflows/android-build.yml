name: Build NovaMarket Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build NovaMarket APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --------------------------------------------------
      # 3. Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 4. Install frontend dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm install

      # --------------------------------------------------
      # 5. Make sure Capacitor Android exists
      # --------------------------------------------------
      - name: Add Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # --------------------------------------------------
      # 6. Sync web files
      # --------------------------------------------------
      - name: Sync NovaMarket
        run: npx cap sync android

      # --------------------------------------------------
      # 7. Add native NovaMarket installer bridge
      # --------------------------------------------------
      - name: Configure native installer bridge
        shell: bash
        run: |
          set -e

          MAIN="android/app/src/main/java"

          MAIN_FILE=$(find "$MAIN" -type f -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_FILE" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          PACKAGE_LINE=$(grep '^package ' "$MAIN_FILE" | head -n 1)

          PACKAGE_NAME=$(echo "$PACKAGE_LINE" | \
            sed 's/^package //' | \
            sed 's/;//' | \
            tr -d '\r')

          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          BRIDGE_DIR="android/app/src/main/java/$PACKAGE_PATH"

          mkdir -p "$BRIDGE_DIR"

          cat > "$BRIDGE_DIR/NovaMarketInstaller.java" <<'JAVA'
          package __PACKAGE__;

          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Environment;
          import android.webkit.JavascriptInterface;

          import androidx.core.content.FileProvider;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class NovaMarketInstaller {

              private final Context context;

              public NovaMarketInstaller(Context context) {
                  this.context = context.getApplicationContext();
              }

              @JavascriptInterface
              public void startInstall(String manifestUrl) {

                  new Thread(() -> {

                      HttpURLConnection connection = null;

                      try {
                          URL url = new URL(manifestUrl);

                          connection =
                                  (HttpURLConnection) url.openConnection();

                          connection.setRequestMethod("GET");
                          connection.setConnectTimeout(15000);
                          connection.setReadTimeout(20000);
                          connection.setRequestProperty(
                                  "Accept",
                                  "application/json"
                          );

                          int responseCode =
                                  connection.getResponseCode();

                          if (responseCode < 200 ||
                              responseCode >= 300) {
                              throw new Exception(
                                  "Manifest HTTP " + responseCode
                              );
                          }

                          InputStream stream =
                                  connection.getInputStream();

                          BufferedReader reader =
                                  new BufferedReader(
                                      new InputStreamReader(stream)
                                  );

                          StringBuilder body =
                                  new StringBuilder();

                          String line;

                          while ((line = reader.readLine()) != null) {
                              body.append(line);
                          }

                          reader.close();

                          JSONObject manifest =
                                  new JSONObject(body.toString());

                          String apkUrl =
                                  manifest.optString("downloadUrl");

                          if (apkUrl.isEmpty()) {
                              apkUrl =
                                  manifest.optString("download_url");
                          }

                          if (apkUrl.isEmpty()) {
                              apkUrl =
                                  manifest.optString("apkUrl");
                          }

                          if (apkUrl.isEmpty()) {
                              throw new Exception(
                                  "APK download URL missing"
                              );
                          }

                          String appName =
                                  manifest.optString(
                                      "name",
                                      "NovaMarket App"
                                  );

                          downloadApk(apkUrl, appName);

                      } catch (Exception error) {

                          error.printStackTrace();

                      } finally {

                          if (connection != null) {
                              connection.disconnect();
                          }
                      }

                  }).start();
              }

              private void downloadApk(
                      String apkUrl,
                      String appName
              ) {

                  DownloadManager manager =
                          (DownloadManager)
                          context.getSystemService(
                              Context.DOWNLOAD_SERVICE
                          );

                  if (manager == null) {
                      return;
                  }

                  Uri uri = Uri.parse(apkUrl);

                  DownloadManager.Request request =
                          new DownloadManager.Request(uri);

                  request.setTitle(appName);

                  request.setDescription(
                      "Downloading from NovaMarket"
                  );

                  request.setMimeType(
                      "application/vnd.android.package-archive"
                  );

                  request.setNotificationVisibility(
                      DownloadManager.Request
                          .VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                  );

                  request.setDestinationInExternalFilesDir(
                      context,
                      Environment.DIRECTORY_DOWNLOADS,
                      "novamarket-" +
                      System.currentTimeMillis() +
                      ".apk"
                  );

                  long downloadId =
                          manager.enqueue(request);

                  InstallReceiver.register(
                      context,
                      downloadId
                  );
              }

              public static class InstallReceiver
                      extends BroadcastReceiver {

                  private static long expectedDownloadId = -1;

                  public static void register(
                          Context context,
                          long downloadId
                  ) {

                      expectedDownloadId = downloadId;

                      IntentFilterHelper.register(
                          context
                      );
                  }

                  @Override
                  public void onReceive(
                          Context context,
                          Intent intent
                  ) {

                      if (!DownloadManager
                              .ACTION_DOWNLOAD_COMPLETE
                              .equals(intent.getAction())) {
                          return;
                      }

                      long id =
                          intent.getLongExtra(
                              DownloadManager.EXTRA_DOWNLOAD_ID,
                              -1
                          );

                      if (id != expectedDownloadId) {
                          return;
                      }

                      DownloadManager manager =
                          (DownloadManager)
                          context.getSystemService(
                              Context.DOWNLOAD_SERVICE
                          );

                      DownloadManager.Query query =
                          new DownloadManager.Query();

                      query.setFilterById(id);

                      Cursor cursor =
                          manager.query(query);

                      if (cursor == null) {
                          return;
                      }

                      try {

                          if (!cursor.moveToFirst()) {
                              return;
                          }

                          int status =
                              cursor.getInt(
                                  cursor.getColumnIndexOrThrow(
                                      DownloadManager
                                          .COLUMN_STATUS
                                  )
                              );

                          if (status !=
                              DownloadManager
                                  .STATUS_SUCCESSFUL) {
                              return;
                          }

                          String localUri =
                              cursor.getString(
                                  cursor.getColumnIndexOrThrow(
                                      DownloadManager
                                          .COLUMN_LOCAL_URI
                                  )
                              );

                          Uri fileUri =
                              Uri.parse(localUri);

                          Intent installIntent =
                              new Intent(
                                  Intent.ACTION_VIEW
                              );

                          installIntent.setDataAndType(
                              fileUri,
                              "application/vnd.android.package-archive"
                          );

                          installIntent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                          );

                          installIntent.addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          );

                          context.startActivity(
                              installIntent
                          );

                      } finally {

                          cursor.close();
                      }
                  }
              }

              private static class IntentFilterHelper {

                  static void register(Context context) {
                      // DownloadManager broadcasts are delivered
                      // through the manifest receiver.
                  }
              }
          }
          JAVA

          sed -i \
            "s/__PACKAGE__/$PACKAGE_NAME/" \
            "$BRIDGE_DIR/NovaMarketInstaller.java"

          # ------------------------------------------------
          # Replace MainActivity with bridge-enabled version
          # ------------------------------------------------

          cat > "$MAIN_FILE" <<JAVA
          $PACKAGE_LINE

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (getBridge() != null &&
                      getBridge().getWebView() != null) {

                      getBridge()
                          .getWebView()
                          .addJavascriptInterface(
                              new NovaMarketInstaller(this),
                              "NovaMarketNative"
                          );
                  }
              }
          }
          JAVA

          # ------------------------------------------------
          # Add provider paths
          # ------------------------------------------------

          mkdir -p \
            android/app/src/main/res/xml

          cat > \
            android/app/src/main/res/xml/novamarket_paths.xml \
            <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path
                  name="novamarket_downloads"
                  path="Download/" />
          </paths>
          XML

          # ------------------------------------------------
          # Patch AndroidManifest
          # ------------------------------------------------

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<manifest",
                  '<manifest\n    <uses-permission android:name="android.permission.INTERNET" />',
                  1
              )

          if "android.permission.REQUEST_INSTALL_PACKAGES" not in text:
              text = text.replace(
                  "<uses-permission android:name=\"android.permission.INTERNET\" />",
                  '<uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />',
                  1
              )

          provider = """
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/novamarket_paths" />
              </provider>
          """

          if "NovaMarketInstaller" not in text:
              text = text.replace(
                  "</application>",
                  provider + "\n"
                  '              <receiver\n'
                  '                  android:name=".NovaMarketInstaller$InstallReceiver"\n'
                  '                  android:exported="false">\n'
                  '                  <intent-filter>\n'
                  '                      <action android:name="android.intent.action.DOWNLOAD_COMPLETE" />\n'
                  '                  </intent-filter>\n'
                  '              </receiver>\n'
                  "        </application>",
                  1
              )

          p.write_text(text)
          PY

          echo "Native NovaMarket installer configured."

      # --------------------------------------------------
      # 8. Build debug APK
      # --------------------------------------------------
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # --------------------------------------------------
      # 9. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      # --------------------------------------------------
      # 10. Upload APK as workflow artifact
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaMarket-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
