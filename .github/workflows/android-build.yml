name: Build NovaMarket APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NovaMarket APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android project
        run: |
          echo "Checking NovaMarket Android project..."
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Android project structure OK."

      - name: Build NovaMarket debug APK
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload NovaMarket APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaMarket-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
