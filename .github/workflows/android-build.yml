name: Build NovaMarket APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NovaMarket APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find NovaMarket package
        shell: bash
        run: |
          echo "Repository:"
          pwd

          echo "Files:"
          ls -la

          echo "Searching for package.json..."

          find . \
            -type f \
            -name "package.json" \
            -not -path "./node_modules/*" \
            -print

      - name: Install dependencies and build
        shell: bash
        run: |
          set -e

          PACKAGE_FILE=$(find . \
            -type f \
            -name "package.json" \
            -not -path "./node_modules/*" \
            | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found."
            echo "The NovaMarket Node/Capacitor project is missing package.json."
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE_FILE")

          echo "Using project directory:"
          echo "$APP_DIR"

          cd "$APP_DIR"

          echo "Installing dependencies..."
          npm install

          echo "Checking Capacitor..."

          if [ ! -d "android" ]; then
            echo "Android project not found."
            echo "Creating Android project..."
            npx cap add android
          fi

          echo "Syncing NovaMarket..."
          npx cap sync android

          echo "Building APK..."
          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find . \
            -type f \
            -path "*/app/build/outputs/apk/debug/app-debug.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaMarket-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
